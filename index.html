<!DOCTYPE html>
<html>
<head>
  <title>Пример подключения плеера</title>
  <meta charset="utf-8">
  <link rel="stylesheet" href="font-awesome-4.7.0/css/font-awesome.min.css">
  <link rel="icon" type="image/png" href="favicon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Roboto&display=swap" rel="stylesheet">
  <style type="text/css">
      .button-play-pause {
        border-style: solid;
        cursor: pointer;
        background-color: transparent;
        width: 30px;
        margin: 3px;
        margin-bottom:8px;
      }
      .button-mute-fulscreen {
        cursor: pointer;
      }
     .button-fa {
      color: white;
      font-size: 148%;
     }  
  </style>
</head>
<body>
  <div id="player" style="width: 800px; height: 600px; box-shadow: 0px 0px 10px 5px; display: flex; flex-direction: column;">

    <div class="js-video-container" style="width: 100%; height: 100%;"></div>
    <div style="background-color: black; display: flex; align-items:center;">
      <button class="js-play-button button-play-pause"><i class="fa fa-play button-fa" aria-hidden="true"></i></button>
      <button class="js-pause-button button-play-pause"><i class="fa fa-pause button-fa" aria-hidden="false"></i></button>
      <button class="js-volume-button button-play-pause"><i class="fa fa-volume-off button-fa" aria-hidden="true"></i></button>
      <button class="js-mute-button button-mute-fulscreen button-play-pause" hidden><i class="fa fa-volume-up button-fa" aria-hidden="true"></i></button>
      <div style="color: white; font-family: 'Roboto'; display: flex; align-items: center; gap: 10px;">
        <span class="js-current-time"></span>
        <p style="font-family: 'Roboto'; margin: 0;">—</p>
        
      </div>
      <div style= "flex-grow: 1;"></div>
      <span class="js-duration" style="color: white; font-family: 'Roboto'; align-items: center;"></span>
      <button class="js-fullscreen-button button-mute-fulscreen button-play-pause"><i class="fa fa-arrows-alt button-fa" aria-hidden="true"></i></button>
    </div>

  </div>
         
  <script src="https://code.jquery.com/jquery-3.4.1.min.js"></script>
  <script src="https://unpkg.com/playable@2.10.3/dist/statics/playable.bundle.min.js"></script>
  <script src="player.js"></script>

  <script type="text/javascript">
    createPlayer({
      elementId: 'player',
      src: 'https://dvmn.org/media/filer_public/d0/16/d016d9b8-4180-4bb9-ad83-0241f61627b8/samsung_demo_-_alive_in_color.mp4',
    });
  </script>

</body>
</html>
