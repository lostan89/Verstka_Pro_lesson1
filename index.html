<!DOCTYPE html>
<html>
<head>
  <title>Пример подключения плеера</title>
  <meta charset="utf-8">
  <link rel="stylesheet" href="/font-awesome-4.7.0/css/font-awesome.min.css">
  <style type="text/css">
      .button-play-pause {
        border-style: solid;
        cursor: pointer;
        background-color: transparent;
        width: 30px;
      }
      .button-mute-fulscreen {
        cursor: pointer;
      }
     .button-fa {
      color: white;
     }  
  </style>
</head>
<body>
  <div id="player" style="width: 800px; height: 600px;">

    <div class="js-video-container" style="width: 100%; height: 100%"></div>
    <div style="background-color: black">
      <button class="js-play-button button-play-pause"><i class="fa fa-play button-fa" aria-hidden="true"></i></button>
      <button class="js-pause-button button-play-pause"><i class="fa fa-pause button-fa" aria-hidden="false"></i></button>
      <!-- <button class="js-pause-button"><i class="fa fa-pause" aria-hidden="true">Pause</i></button> -->
      <button class="js-volume-button">Volume</button>
      <button class="js-mute-button button-mute-fulscreen" hidden>Mute</button>
      <button class="js-fullscreen-button button-mute-fulscreen">Fullscreen</button>
    </div>
    <div style="color: white;">
      <span class="js-current-time"></span>
      —
      <span class="js-duration"></span>
    </div>

    <div class="js-progress" style="background-color: grey;">
      <div class="js-progress-slider" style="background-color: red;">Прогресс</div>
    </div>
  </div>

  <script src="https://code.jquery.com/jquery-3.4.1.min.js"></script>
  <script src="https://unpkg.com/playable@2.10.3/dist/statics/playable.bundle.min.js"></script>
  <script src="player.js"></script>

  <script type="text/javascript">
    createPlayer({
      elementId: 'player',
      src: 'https://dvmn.org/media/filer_public/d0/16/d016d9b8-4180-4bb9-ad83-0241f61627b8/samsung_demo_-_alive_in_color.mp4',
    });
  </script>

</body>
</html>
